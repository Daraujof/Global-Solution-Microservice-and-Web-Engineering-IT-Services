spring.application.name=to-no-direito-api
server.port=${PORT:8080}

# ---------- Microsoft SQL Server ----------
# Credenciais NUNCA ficam no repositorio: vem de variaveis de ambiente
# (no Azure: App Settings / Container Apps secrets; localmente: export DB_URL=... etc.)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=tonodireito;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Erros: nunca expor detalhes internos ----------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# ---------- OpenAPI / Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ---------- Actuator (health check para o Azure) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Carga inicial de direitos de exemplo quando o banco esta vazio
app.seed.enabled=${APP_SEED_ENABLED:true}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
